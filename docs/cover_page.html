<div style="text-align: center; padding: 60px 20px 30px;">
    <img src="../assets/sivi-logo.png" alt="SIVI" style="width: 200px; margin-bottom: 30px;" />
    <h1 style="color: #2D5E5E; font-size: 2.2em; border-bottom: 4px solid #FFDA09; padding-bottom: 0.3em; display: inline-block;">{{ config.site_name }}</h1>
    <p style="color: #3E8080; font-size: 1.1em; margin-top: 15px;">{{ config.site_description }}</p>
    <img src="../media/image1.png" alt="Data exchange" style="width: 180px; margin: 30px auto 10px; display: block;" />
    <table style="margin: 30px auto; text-align: left; border-collapse: collapse;">
        <tr>
            <td style="padding: 8px 20px; font-weight: 600; color: #2D5E5E; border-bottom: 1px solid #E7F2EE;">Author(s)</td>
            <td style="padding: 8px 20px; border-bottom: 1px solid #E7F2EE;">{{ config.site_author }}</td>
        </tr>
        <tr>
            <td style="padding: 8px 20px; font-weight: 600; color: #2D5E5E; border-bottom: 1px solid #E7F2EE;">Status</td>
            <td style="padding: 8px 20px; border-bottom: 1px solid #E7F2EE;">Release 2027 (v1.4.0)</td>
        </tr>
        <tr>
            <td style="padding: 8px 20px; font-weight: 600; color: #2D5E5E;">Website</td>
            <td style="padding: 8px 20px;"><a href="https://www.sivi.org" style="color: #274F77;">www.sivi.org</a></td>
        </tr>
    </table>
    <hr style="border: none; border-top: 3px solid #FFDA09; margin: 40px 80px;" />
    <p style="color: #666; font-size: 0.9em;">&copy; SIVI &mdash; Knowledge and standardisation institute for financial services</p>
</div>
